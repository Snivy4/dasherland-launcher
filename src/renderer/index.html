<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dasherland Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 id="server-name">Dasherland</h1>
    </header>

    <section id="login-screen" class="screen">
      <p>Sign in with your Microsoft account to play.</p>
      <button id="login-btn">Sign in with Microsoft</button>
    </section>

    <section id="play-screen" class="screen hidden">
      <div id="profile-row">
        <span id="profile-name"></span>
        <button id="logout-btn">Sign out</button>
      </div>
      <button id="play-btn">Play</button>
      <div id="progress" class="hidden"></div>
      <details id="log-details" class="hidden">
        <summary>Game log</summary>
        <pre id="log-output"></pre>
      </details>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
